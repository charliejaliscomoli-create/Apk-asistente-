name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure Android SDK and Accept Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a533f3334216d753b284c14f129" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "601085b94cd77f0b54ff86406955dce50e1d2427" > "$ANDROID_HOME/licenses/android-googletv-license"
          echo "33b6a2b64f2130729876a9821371966582d61797" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "859f317696f67ef3d7f30a50a5560e7834b43903" > "$ANDROID_HOME/licenses/google-gdk-license"
          echo "mips-android-sysimage-license" > "$ANDROID_HOME/licenses/mips-android-sysimage-license"
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" || true
          fi

      - name: Setup environment and debug keystore
        run: |
          # 1. Ensure .env exists
          touch .env
          if [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          fi

          # 2. Decode or generate debug.keystore
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Famous-Asistente-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          - name: Setup Android SDK
            uses: android-actions/setup-android@v3
              with:
                  api-level: 36
                      build-tools: 36.0.0
                          cache: true

                          - name: Configure Android SDK and Accept Licenses
                            run: |
                                mkdir -p "$ANDROID_HOME/licenses" || true
                                    echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
                                        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
                                            echo "84831b9409646a533f3334216d753b284c14f129" >> "$ANDROID_HOME/licenses/android-sdk-license"
                                                echo "601085b94cd77f0b54ff86406955dce50e1d2427" > "$ANDROID_HOME/licenses/android-googletv-license"
                                                    echo "33b6a2b64f2130729876a9821371966582d61797" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
                                                        echo "859f317696f67ef3d7f30a50a5560e7834b43903" > "$ANDROID_HOME/licenses/google-gdk-license"
